<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>assfin report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #f5f5f7; --card: #ffffff; --well: #fafafa; --ink: #09090b;
    --muted: #6e6e73; --faint: #a1a1a6; --line: rgba(0,0,0,.07); --line-strong: rgba(0,0,0,.14);
    --waf: #8e8e93; --dead: #dcdce1;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 40px 24px 80px; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; color: var(--muted); font-size: 13px; }
  .brand { font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
  h1 { font-size: clamp(40px, 7vw, 84px); line-height: 1; letter-spacing: -0.045em; font-weight: 700; margin: 40px 0 12px; overflow-wrap: anywhere; }
  .sub { color: var(--muted); margin: 0 0 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .dur-badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; background: var(--well); border: 1px solid var(--line); color: var(--ink); font-size: 12.5px; }
  .dur-badge svg { opacity: .65; }

  .surface { background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 28px; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 10px 30px rgba(0,0,0,.04); }
  .bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--well); gap: 3px; }
  .seg { width: 0; border-radius: 999px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .seg.exposed { background: var(--ink); } .seg.waf { background: var(--waf); } .seg.dead { background: var(--dead); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .key { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--well); cursor: pointer; }
  .key:hover { border-color: var(--line-strong); }
  .key[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .key[aria-pressed="true"] .dot.exposed { background: #fff; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot.exposed { background: var(--ink); } .dot.waf { background: var(--waf); } .dot.dead { background: var(--dead); } .dot.new { background: transparent; border: 2px solid currentColor; width: 10px; height: 10px; }
  .key .num { font-weight: 500; }
  .key small { color: var(--muted); font-size: 13px; }
  .key[aria-pressed="true"] small { color: #d2d2d7; }

  .tools { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px 0; margin-top: 24px; background: linear-gradient(var(--page) 80%, transparent); }
  .search { flex: 1 1 260px; height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--card); }
  .chip { height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  select.chip { padding-right: 12px; }
  .count { margin-left: auto; color: var(--muted); font-size: 13px; }

  .table-card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 14px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--well); }
  th button { all: unset; cursor: pointer; }
  th button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  th[aria-sort="ascending"] button::after { content: " ↑"; } th[aria-sort="descending"] button::after { content: " ↓"; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.row { cursor: pointer; } tr.row:hover td { background: var(--well); }
  tr.row.dead td { color: var(--faint); }
  .host { font-weight: 500; white-space: nowrap; } .host .rest { color: var(--faint); font-weight: 400; }
  .badge { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--ink); font-size: 11px; font-weight: 500; vertical-align: 1px; }
  .title { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; max-width: 340px; }
  .pill { padding: 2px 9px; border-radius: 999px; background: #f0f0f2; font-size: 12px; white-space: nowrap; }
  .ips { font-size: 12.5px; color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.detail td { background: var(--well); padding: 0 16px; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 28px; padding: 18px 0 22px; }
  .detail-grid dt { color: var(--muted); font-size: 12px; } .detail-grid dd { margin: 2px 0 0; overflow-wrap: anywhere; }
  .detail-grid a { color: var(--ink); }
  .empty { padding: 56px 24px; text-align: center; color: var(--muted); }
  footer { margin-top: 32px; color: var(--faint); font-size: 12.5px; }

  @media (max-width: 720px) { .wrap { padding: 24px 14px 60px; } .surface { padding: 20px; border-radius: 22px; } .count { width: 100%; margin: 0; } }
  @media (prefers-reduced-motion: reduce) { .seg { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header><span class="brand">assfin</span><span id="generated" class="num"></span></header>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <section class="surface" aria-label="Attack surface">
    <div class="bar" role="img" id="bar">
      <div class="seg exposed" id="seg-exposed"></div><div class="seg waf" id="seg-waf"></div><div class="seg dead" id="seg-dead"></div>
    </div>
    <div class="legend">
      <button class="key" data-key="exposed" aria-pressed="false"><span class="dot exposed"></span><span class="num" id="n-exposed"></span><small>reachable, no WAF</small></button>
      <button class="key" data-key="waf" aria-pressed="false"><span class="dot waf"></span><span class="num" id="n-waf"></span><small>behind WAF</small></button>
      <button class="key" data-key="dead" aria-pressed="false"><span class="dot dead"></span><span class="num" id="n-dead"></span><small>no response</small></button>
      <button class="key" data-key="new" aria-pressed="false"><span class="dot new"></span><span class="num" id="n-new"></span><small>new this scan</small></button>
    </div>
  </section>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Search host, title, tech, IP" aria-label="Search">
    <button class="chip" data-status="2" aria-pressed="false">2xx</button>
    <button class="chip" data-status="3" aria-pressed="false">3xx</button>
    <button class="chip" data-status="4" aria-pressed="false">4xx</button>
    <button class="chip" data-status="5" aria-pressed="false">5xx</button>
    <select class="chip" id="tech" aria-label="Technology"><option value="">Any tech</option></select>
    <select class="chip" id="root" aria-label="Root domain" hidden><option value="">All roots</option></select>
    <span class="count num" id="count" aria-live="polite"></span>
  </div>

  <div class="table-card">
    <div class="scroll">
      <table>
        <thead><tr>
          <th data-sort="host"><button>Host</button></th>
          <th data-sort="status"><button>Status</button></th>
          <th data-sort="title"><button>Title</button></th>
          <th>Tech</th>
          <th data-sort="waf"><button>WAF</button></th>
          <th data-sort="ips"><button>IP</button></th>
          <th data-sort="depth"><button>Depth</button></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>No hosts match these filters. Clear the search or switch a filter off.</div>
  </div>
  <footer>Passive enumeration by subfinder, probing by httpx. Click a row for details.</footer>
</div>

<script>
const DATA = {{ .DataJSON }};
(() => {
  const $ = (id) => document.getElementById(id);
  const fmt = new Intl.NumberFormat();
  const hosts = DATA.hosts;
  const state = { q: "", key: "", status: new Set(), tech: "", root: "", sort: "depth", dir: 1, open: null };

  
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const kind = (h) => !h.alive ? "dead" : h.waf ? "waf" : "exposed";

  function fmtSec(sec) {
    sec = Math.round(sec);
    if (sec < 1) return "<1s";
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0) return `${h}h ${m}m ${s}s`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
  }

  function updateSubtitle() {
    const targetRoot = state.root ? DATA.roots.find(r => r.root === state.root) : (DATA.roots.length === 1 ? DATA.roots[0] : null);
    let dur = "";
    let lastDate = "";

    if (targetRoot) {
      dur = targetRoot.duration || "";
      lastDate = targetRoot.last;
    } else {
      const dates = DATA.roots.map(r => r.last).filter(Boolean).sort();
      lastDate = dates.pop() || "";
      const totalSec = DATA.roots.reduce((acc, r) => acc + (r.duration_sec || 0), 0);
      if (totalSec > 0) {
        dur = fmtSec(totalSec);
      }
    }

    const hostCount = state.root ? hosts.filter(h => h.root === state.root).length : hosts.length;
    const sub = $("subtitle");
    sub.replaceChildren();

    const countSpan = el("span", "num", fmt.format(hostCount));
    sub.append(countSpan, document.createTextNode(" subdomains found"));

    if (lastDate) {
      sub.append(document.createTextNode(", last scanned " + new Date(lastDate).toLocaleString()));
    }

    if (dur) {
      const badge = el("span", "dur-badge");
      badge.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="num">${dur}</span>`;
      badge.title = "Total scan elapsed duration";
      sub.append(badge);
    }
  }

  const roots = DATA.roots.map(r => r.root);
  $("title").textContent = roots.length === 1 ? roots[0] : roots.length + " root domains";
  updateSubtitle();
  $("generated").textContent = "Report " + new Date(DATA.generated).toLocaleString();
  if (roots.length > 1) {
    $("root").hidden = false;
    roots.forEach(r => $("root").append(new Option(r, r)));
  }

  const counts = { exposed: 0, waf: 0, dead: 0, new: 0 };
  const techCount = {};
  hosts.forEach(h => {
    counts[kind(h)]++; if (h.new) counts.new++;
    h.tech.forEach(t => techCount[t] = (techCount[t] || 0) + 1);
    h._text = [h.host, h.title, h.tech.join(" "), h.ips, h.waf, h.server].join(" ").toLowerCase();
  });
  ["exposed", "waf", "dead", "new"].forEach(k => $("n-" + k).textContent = fmt.format(counts[k]));
  $("bar").setAttribute("aria-label", `${counts.exposed} reachable without WAF, ${counts.waf} behind WAF, ${counts.dead} no response`);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const total = hosts.length || 1;
    ["exposed", "waf", "dead"].forEach(k => $("seg-" + k).style.width = (counts[k] / total * 100) + "%");
  }));
  Object.entries(techCount).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .forEach(([t, n]) => $("tech").append(new Option(`${t} (${n})`, t)));

  function matches(h) {
    if (state.root && h.root !== state.root) return false;
    if (state.key === "new" ? !h.new : state.key && kind(h) !== state.key) return false;
    if (state.status.size && !(h.alive && state.status.has(String(h.status)[0]))) return false;
    if (state.tech && !h.tech.includes(state.tech)) return false;
    return !state.q || state.q.split(/\s+/).every(w => h._text.includes(w));
  }

  function cmp(a, b) {
    const k = state.sort;
    let x = a[k], y = b[k];
    if (k === "status") { x = a.alive ? a.status : 999; y = b.alive ? b.status : 999; }
    const r = typeof x === "number" ? x - y : String(x).localeCompare(String(y));
    return (r || a.host.localeCompare(b.host)) * state.dir;
  }

  function detail(h) {
    const tr = el("tr", "detail"), td = el("td"); td.colSpan = 7;
    const dl = el("dl", "detail-grid");
    const add = (k, v) => { if (!v && v !== 0) return; const d = el("div"); d.append(el("dt", null, k)); const dd = el("dd"); typeof v === "string" ? dd.textContent = v : dd.append(v); d.append(dd); dl.append(d); };
    if (/^https?:\/\//i.test(h.url)) { const a = el("a", null, h.url); a.href = h.url; a.target = "_blank"; a.rel = "noopener noreferrer"; add("URL", a); }
    add("Server", h.server); add("CDN", h.cdn); add("WAF", h.waf || "none detected");
    add("IPs", h.ips); add("Content length", h.alive ? fmt.format(h.length) + " bytes" : "");
    add("Sources", h.sources.split(",").join(", ")); add("First seen", new Date(h.first_seen).toLocaleString());
    add("Last seen", new Date(h.last_seen).toLocaleString());
    td.append(dl); tr.append(td); return tr;
  }

  function render() {
    const list = hosts.filter(matches).sort(cmp);
    const body = $("rows"); body.replaceChildren();
    const frag = document.createDocumentFragment();
    list.forEach(h => {
      const tr = el("tr", "row" + (h.alive ? "" : " dead")); tr.tabIndex = 0;
      tr.setAttribute("aria-expanded", state.open === h.host);
      const host = el("td", "host");
      const prefix = h.host === h.root ? h.host : h.host.slice(0, -(h.root.length + 1));
      host.append(el("span", null, prefix));
      if (h.host !== h.root) host.append(el("span", "rest", "." + h.root));
      if (h.new) host.append(el("span", "badge", "new"));
      const pills = el("div", "pills"); h.tech.forEach(t => pills.append(el("span", "pill", t)));
      const techTd = el("td"); techTd.append(pills);
      tr.append(host, el("td", "num", h.alive ? h.status : "–"), el("td", "title", h.title), techTd,
        el("td", null, h.waf || (h.alive ? "none" : "")), el("td", "ips num", h.ips), el("td", "num", h.depth));
      tr.querySelector(".title").title = h.title;
      const toggle = () => { state.open = state.open === h.host ? null : h.host; render(); };
      tr.addEventListener("click", toggle);
      tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
      frag.append(tr);
      if (state.open === h.host) frag.append(detail(h));
    });
    body.append(frag);
    $("empty").hidden = list.length > 0;
    $("count").textContent = `${fmt.format(list.length)} of ${fmt.format(hosts.length)}`;
    document.querySelectorAll("th[data-sort]").forEach(th =>
      th.setAttribute("aria-sort", th.dataset.sort === state.sort ? (state.dir > 0 ? "ascending" : "descending") : "none"));
  }

  $("q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
  $("tech").addEventListener("change", e => { state.tech = e.target.value; render(); });
  $("root").addEventListener("change", e => { state.root = e.target.value; updateSubtitle(); render(); });
  document.querySelectorAll(".key").forEach(b => b.addEventListener("click", () => {
    state.key = state.key === b.dataset.key ? "" : b.dataset.key;
    document.querySelectorAll(".key").forEach(k => k.setAttribute("aria-pressed", k.dataset.key === state.key));
    render();
  }));
  document.querySelectorAll("[data-status]").forEach(b => b.addEventListener("click", () => {
    const s = b.dataset.status;
    state.status.has(s) ? state.status.delete(s) : state.status.add(s);
    b.setAttribute("aria-pressed", state.status.has(s));
    render();
  }));
  document.querySelectorAll("th[data-sort] button").forEach(b => b.addEventListener("click", () => {
    const k = b.parentElement.dataset.sort;
    state.dir = state.sort === k ? -state.dir : 1; state.sort = k; render();
  }));
  render();
})();
</script>
</body>
</html>
